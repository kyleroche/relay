packages:
  - packages/*
  - apps/*
# pnpm 12: overrides live here (package.json "pnpm" is no longer read). Floors for advisories in transitive tooling deps.
overrides:
  tinypool: '>=2.1.2'
  source-map-js: '>=1.2.2'
  esbuild: '>=0.28.1'
  '@vitest/mocker': '>=4.1.11'
  vite: '>=7.3.7'
  zod: '>=4.6.6'
# build scripts pnpm may run (pnpm 12 blocks the rest); esbuild downloads its binary in postinstall
allowBuilds:
  esbuild: true
# pnpm holds back releases younger than its minimum age; Board ships daily while it is experimental, so the pinned
# version is named here. Drop the entry once the version in use is older than the window.
minimumReleaseAgeExclude:
  - '@vercel/board@0.52.0'
  - eve@1.4.0
