# Publish @kyleroche/relay to npm when a v* tag is pushed. The tag must equal the version in packages/cli/package.json.
# Authentication is npm trusted publishing (OIDC): the job presents its GitHub identity, npm checks it against the
# trusted publisher configured on the package, and no token is stored anywhere (docs/HOSTING.md, "Publishing the CLI").
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tag matches the package version
        run: |
          version="$(jq -r .version packages/cli/package.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/cli/package.json version $version"; exit 1
          fi
          echo "publishing @kyleroche/relay@$version"

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build, pack, install the tarball into an empty directory and run it
        run: scripts/check-package.sh

      - name: Stage the release on npm
        working-directory: packages/cli
        # Staged publishing: the package's trusted publisher may only stage (npm's "stage publish" permission), and a
        # person approves the staged version on npmjs.com with 2FA before it goes live. `pnpm pack` rewrites the
        # workspace:* dependencies into real versions inside the tarball; --provenance attaches the SLSA attestation.
        # No token anywhere: the job's OIDC identity is what npm trusts. npm stage needs npm 11.15 or newer.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install -g npm@latest
          npm --version
          pnpm pack
          # provenance attestations are only accepted from public source repositories; attach one when the repo is public
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = "false" ]; then PROV="--provenance"; else PROV=""; echo "::notice::repository is private: staging without provenance"; fi
          npm stage publish ./kyleroche-relay-*.tgz $PROV --access public
          echo "::notice::staged @kyleroche/relay $(jq -r .version package.json): approve it at https://www.npmjs.com/package/@kyleroche/relay (Staged packages) or with npm stage approve"
